        else if (i === 89) { text = "89. В одноразовую мягкую упаковку (пакеты) красного цвета собираются отходы"; pairs = [["А","класс В"],["Б","класс Б"],["В","класс А"],["Г","класс Г"]]; correct="А"; }
        else if (i === 90) { text = "90. Согласно СП 3.1.1.2341-08, мерой специфической профилактики заболеваемости вирусными гепатитами у медработников является"; pairs = [["А","вакцинация"],["Б","антибиотикотерапия"],["В","прием иммуномодуляторов"],["Г","интерферонотерапия"]]; correct="А"; }
        else if (i === 103) { text = "103. Контроль качества предстерилизационной очистки старшей медсестрой проводится"; pairs = [["А","1 раз в месяц"],["Б","ежедневно"],["В","не реже 1 раза в неделю"],["Г","1 раз в квартал"]]; correct="А"; }
        else { text = `${i}. Вопрос ${i}`; pairs = [["А","Вариант А"],["Б","Вариант Б"],["В","Вариант В"],["Г","Вариант Г"]]; correct="А"; }
        
        questionsBank.push({ text, pairs, correct });
    }

    // Функция перемешивания
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Построение случайного теста
    function buildRandomTest() {
        let shuffled = shuffleArray([...questionsBank]);
        return shuffled.map(q => ({
            originalText: q.text,
            shuffledPairs: shuffleArray([...q.pairs]),
            correctLetter: q.correct
        }));
    }

    let currentQuestions = buildRandomTest();
    let userAnswers = new Array(currentQuestions.length).fill(null);

    function renderTest() {
        const container = document.getElementById('test-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-text';
            questionDiv.innerText = q.originalText;
            card.appendChild(questionDiv);
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            q.shuffledPairs.forEach((pair, optIdx) => {
                const letter = pair[0];
                const answerText = pair[1];
                const radioId = `q${idx}_opt${optIdx}`;
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question${idx}`;
                radio.value = letter;
                radio.id = radioId;
                if (userAnswers[idx] === letter) radio.checked = true;
                radio.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        userAnswers[idx] = letter;
                        showFeedback(idx);
                        updateScore();
                    }
                });
                const label = document.createElement('label');
                label.htmlFor = radioId;
                label.innerText = `${letter}) ${answerText}`;
                optionDiv.appendChild(radio);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });
            card.appendChild(optionsDiv);
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback';
            feedbackDiv.id = `fb-${idx}`;
            card.appendChild(feedbackDiv);
            container.appendChild(card);
            if (userAnswers[idx] !== null) showFeedback(idx);
        });
        document.getElementById('totalCount').innerText = currentQuestions.length;
        updateScore();
    }

    function showFeedback(idx) {
        const fbDiv = document.getElementById(`fb-${idx}`);
        const selectedLetter = userAnswers[idx];
        const q = currentQuestions[idx];
        if (!selectedLetter) {
            fbDiv.innerHTML = '⚡ Ответ не выбран';
            fbDiv.className = 'feedback';
            return;
        }
        const isCorrect = (selectedLetter === q.correctLetter);
        if (isCorrect) {
            fbDiv.innerHTML = '✅ Верно!';
            fbDiv.className = 'feedback correct';
        } else {
            fbDiv.innerHTML = '❌ Неверно. Попробуйте ещё раз.';
            fbDiv.className = 'feedback incorrect';
        }
    }

    function updateScore() {
        let correct = 0;
        for (let i = 0; i < currentQuestions.length; i++) {
            if (userAnswers[i] && userAnswers[i] === currentQuestions[i].correctLetter) correct++;
        }
        document.getElementById('scoreDisplay').innerText = correct;
    }

    function resetAll() {
        userAnswers = new Array(currentQuestions.length).fill(null);
        renderTest();
    }

    function newRandomVersion() {
        currentQuestions = buildRandomTest();
        userAnswers = new Array(currentQuestions.length).fill(null);
        renderTest();
    }

    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('reshuffleBtn').addEventListener('click', newRandomVersion);
    renderTest();
</script>
</body>
</html>
